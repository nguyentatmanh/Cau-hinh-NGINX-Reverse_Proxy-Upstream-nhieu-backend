# ==============================================================================
# BƯỚC 3 & 4: CÂN BẰNG TẢI UPSTREAM VỚI NHIỀU BACKEND (api1 & api2)
# - Khai báo block upstream backend_cluster
# - Phân phối tải mặc định theo thuật toán Round-Robin
# - Docker Network DNS tự động phân giải tên service api1 và api2
# ==============================================================================

upstream backend_cluster {
    server api1:3000 max_fails=3 fail_timeout=10s;
    server api2:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name myapp.local localhost;

    access_log /var/log/nginx/step3_access.log;
    error_log  /var/log/nginx/step3_error.log warn;

    # Giữ nguyên 1m để thử nghiệm lỗi 413 ở Bước 5
    client_max_body_size 1m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp tới upstream cluster
    location /api/ {
        proxy_pass http://backend_cluster;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
