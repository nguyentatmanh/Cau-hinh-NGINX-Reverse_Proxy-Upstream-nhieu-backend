# ==============================================================================
# BƯỚC 5: XỬ LÝ LỖI 413 (PAYLOAD TOO LARGE) & ZERO-DOWNTIME RELOAD
# - Nâng giới hạn client_max_body_size từ 1m lên 20m
# - Kiểm tra cú pháp an toàn: docker compose exec proxy nginx -t
# - Nạp nóng cấu hình không gián đoạn: docker compose exec proxy nginx -s reload
# ==============================================================================

upstream backend_cluster {
    server api1:3000 max_fails=3 fail_timeout=10s;
    server api2:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name myapp.local localhost;

    access_log /var/log/nginx/step5_access.log;
    error_log  /var/log/nginx/step5_error.log warn;

    # NÂNG HẠN MỨC LÊN 20MB -> KHẮC PHỤC LỖI 413
    client_max_body_size 20m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend_cluster;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
