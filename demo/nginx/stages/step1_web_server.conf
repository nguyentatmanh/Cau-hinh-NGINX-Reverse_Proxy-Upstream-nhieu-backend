# ==============================================================================
# BƯỚC 1: NGINX ĐÓNG VAI TRÒ WEB SERVER TĨNH (STATIC WEB SERVER & SPA)
# - Phục vụ HTML/CSS/JS từ thư mục /usr/share/nginx/html
# - Hỗ trợ Single Page Application (SPA) routing: F5 không bị 404
# ==============================================================================

server {
    listen 80;
    server_name myapp.local localhost;

    access_log /var/log/nginx/step1_access.log;
    error_log  /var/log/nginx/step1_error.log warn;

    # Phục vụ file tĩnh & SPA Routing
    # Nếu tệp $uri không có -> tìm thư mục $uri/ -> nếu không có -> trả về /index.html
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
