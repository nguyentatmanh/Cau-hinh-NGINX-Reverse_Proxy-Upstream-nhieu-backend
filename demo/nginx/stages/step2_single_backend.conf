# ==============================================================================
# BƯỚC 2: REVERSE PROXY ĐẾN MỘT BACKEND DUY NHẤT (api1:3000)
# - Định tuyến / -> Frontend tĩnh
# - Chuyển tiếp /api/ -> http://api1:3000 (Docker service name)
# - Thiết lập 4 forwarded headers để backend nhận diện đúng client
# ==============================================================================

server {
    listen 80;
    server_name myapp.local localhost;

    access_log /var/log/nginx/step2_access.log;
    error_log  /var/log/nginx/step2_error.log warn;

    client_max_body_size 1m;

    # 1. Phục vụ Frontend tĩnh & SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy tới một backend đơn lẻ (api1:3000)
    # LƯU Ý: Không có dấu '/' ở cuối tên backend để giữ nguyên tiền tố '/api/...'
    location /api/ {
        proxy_pass http://api1:3000;

        # 4 forwarded headers bắt buộc
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tối ưu kết nối
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
