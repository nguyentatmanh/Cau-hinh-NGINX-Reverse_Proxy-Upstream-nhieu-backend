# ==============================================================================
# BƯỚC 6: CẤU HÌNH DOMAIN ẢO VÀ HTTPS VỚI CHỨNG CHỈ TỰ KÝ CÓ SAN
# - Domain ảo: myapp.local (khai báo trong C:\Windows\System32\drivers\etc\hosts)
# - Cổng 80: HTTP (Ánh xạ 8080 trên host)
# - Cổng 443: HTTPS TLS v1.2/v1.3 (Ánh xạ 8443 trên host)
# ==============================================================================

upstream backend_cluster {
    server api1:3000 max_fails=3 fail_timeout=10s;
    server api2:3000 max_fails=3 fail_timeout=10s;
}

# 1. Server Block HTTP
server {
    listen 80;
    server_name myapp.local localhost;

    access_log /var/log/nginx/step6_http_access.log;
    error_log  /var/log/nginx/step6_http_error.log warn;

    client_max_body_size 20m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend_cluster;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# 2. Server Block HTTPS (SSL/TLS Termination)
server {
    listen 443 ssl;
    server_name myapp.local;

    # Đường dẫn chứng chỉ và khóa riêng tư (Mount từ thư mục ssl)
    ssl_certificate     /etc/nginx/certs/myapp.crt;
    ssl_certificate_key /etc/nginx/certs/myapp.key;

    # Giao thức và mã hóa an toàn
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/step6_ssl_access.log;
    error_log  /var/log/nginx/step6_ssl_error.log warn;

    client_max_body_size 20m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend_cluster;

        # Forwarded headers: X-Forwarded-Proto sẽ là 'https'
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
