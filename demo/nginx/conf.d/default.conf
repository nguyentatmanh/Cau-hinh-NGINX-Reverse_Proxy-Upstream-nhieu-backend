# ==============================================================================
# CẤU HÌNH MẪU THỰC HÀNH NGINX REVERSE PROXY & UPSTREAM - BUỔI 8 (NHÓM 8)
# Trường Đại học Xây dựng Hà Nội (HUCE)
# ==============================================================================

# 1. Khai báo cụm backend upstream (2 instance API Node.js: api1 và api2)
upstream backend_cluster {
    server api1:3000 max_fails=3 fail_timeout=10s;
    server api2:3000 max_fails=3 fail_timeout=10s;
}

# 2. Server Block HTTP (Lắng nghe cổng 80 trong container -> Ánh xạ 8080 trên host)
server {
    listen 80;
    server_name myapp.local localhost;

    # Cấu hình nhật ký truy cập & lỗi
    access_log /var/log/nginx/myapp_access.log;
    error_log  /var/log/nginx/myapp_error.log warn;

    # Giới hạn kích thước request body (Mặc định: 1m).
    # [Thực hành Bước 5]: Ban đầu để 1m để bắt lỗi 413 Payload Too Large.
    # Sau đó nâng lên 20m và reload: docker compose exec proxy nginx -s reload
    client_max_body_size 1m;

    # Bước 1: Phục vụ Frontend tĩnh (HTML/CSS/JS) với SPA fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Bước 2, 3 & 4: Reverse Proxy chuyển tiếp API tới Upstream Cluster (api1 & api2)
    # QUAN TRỌNG: Không có dấu '/' ở cuối tên upstream để bảo toàn tiền tố '/api/...'
    location /api/ {
        proxy_pass http://backend_cluster;
        
        # Bốn forwarded headers bắt buộc để bảo toàn danh tính client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tối ưu kết nối proxy HTTP/1.1
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# 3. Server Block HTTPS (Lắng nghe cổng 443 SSL trong container -> Ánh xạ 8443 trên host)
# [Thực hành Bước 6]: Sử dụng chứng chỉ tự ký có SAN DNS:myapp.local
server {
    listen 443 ssl;
    server_name myapp.local;

    ssl_certificate     /etc/nginx/certs/myapp.crt;
    ssl_certificate_key /etc/nginx/certs/myapp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/myapp_ssl_access.log;
    error_log  /var/log/nginx/myapp_ssl_error.log warn;

    client_max_body_size 1m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
